events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression for low latent responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SCALING FIX: nginx resolves upstream hostnames ONCE at startup
    # by default and caches the result forever — so `docker compose
    # up --scale api=3` (see docker-compose.yml's own comment on this)
    # would silently keep sending 100% of traffic to whichever single
    # api container existed when nginx booted. 127.0.0.11 is Docker's
    # embedded DNS server on the default bridge network; re-resolving
    # against it every 10s is what actually makes `--scale` work.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # `api` is set as a variable (not a static upstream block)
        # specifically so nginx re-resolves it via the `resolver`
        # directive above on every request rather than once at
        # startup — a static `upstream { server api:3001; }` block,
        # like the one this replaced, does NOT get that behavior.
        set $api_upstream api:3001;

        location / {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Fast timeouts for ordinary REST calls...
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # rooms.gateway.ts's Socket.IO namespace needs a long-lived
        # connection, not the 15s read timeout above — that block
        # would silently kill every open watch-party socket every 15
        # seconds. Matched to Socket.IO's own default ~25s
        # ping-interval/ping-timeout pair with headroom.
        location /socket.io/ {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
